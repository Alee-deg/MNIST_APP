name: Build Digit Studio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x86_64
          - runner: ubuntu-22.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x86_64

    defaults:
      run:
        shell: bash

    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyTorch CPU
        run: |
          python -m pip install --timeout 120 --retries 5 -r desktop_app/requirements.txt pyinstaller
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python -m pip install --timeout 120 --retries 5 torch
          else
            python -m pip install --timeout 120 --retries 5 torch --index-url https://download.pytorch.org/whl/cpu
          fi

      - name: Check source inference
        run: python -m desktop_app --check-models

      - name: Build native application
        run: python -m PyInstaller --clean --noconfirm DigitStudio.spec

      - name: Check Linux desktop window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          xvfb-run -a ./dist/DigitStudio/DigitStudio --check-window

      - name: Verify executable and archive distribution
        run: python -m desktop_app.package_build

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: DigitStudio-${{ matrix.target }}
          path: packages/
          if-no-files-found: error
